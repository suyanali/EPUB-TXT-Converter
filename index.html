<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245c82"><meta name="description" content="本機離線 EPUB 轉 TXT，支援 OpenCC 簡轉繁"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>EPUB → TXT 轉換器</title></head><body><main class="shell"><header><div><p class="eyebrow">LOCAL-FIRST · OFFLINE READY</p><h1>EPUB <span>→</span> TXT</h1><p class="muted">電子書在瀏覽器內處理，不上傳伺服器。</p></div><div class="top-actions"><span id="version" class="version"></span><button id="checkUpdate" class="subtle">檢查更新</button><button id="install" class="subtle" hidden>安裝 App</button></div></header><section class="panel"><label id="drop" class="drop"><input id="files" type="file" accept=".epub,application/epub+zip" multiple hidden><span class="drop-icon">⇧</span><strong>點擊選擇 EPUB，或拖曳檔案到這裡</strong><small>可一次選擇多本 · 不支援 DRM 加密電子書</small></label><div id="fileList" class="file-list" aria-live="polite"></div></section><section class="panel"><h2>轉換設定</h2><div class="settings"><fieldset><legend>文字轉換</legend><label class="choice"><input type="radio" name="convert" value="none" checked><span><b>不轉換（預設）</b><small>保留原書字詞與簡繁文字。</small></span></label><label class="choice"><input type="radio" name="convert" value="tw"><span><b>簡體 → 台灣繁體</b><small>轉成台灣繁體字形，盡量保留原書用詞。</small></span></label><label class="choice"><input type="radio" name="convert" value="twp"><span><b>簡體 → 台灣繁體＋慣用詞</b><small>另外轉換部分地區用語，例如「鼠标」為「滑鼠」。</small></span></label></fieldset><fieldset><legend>段落排版</legend><label class="choice"><input type="radio" name="layout" value="original" checked><span><b>保留原始段落（預設）</b><small>依原書段落分隔，不任意合併或拆分。</small></span></label><label class="choice"><input type="radio" name="layout" value="novel"><span><b>小說閱讀模式</b><small>段首縮排兩個全形空格，章節前後增加空行。</small></span></label><label class="choice"><input type="radio" name="layout" value="compact"><span><b>精簡模式</b><small>每段只換一行，減少多餘空白。</small></span></label></fieldset></div><div class="options"><label><input id="chapters" type="checkbox" checked> 保留章節標題 <small>在 TXT 中保留正文的章節標題。</small></label><label><input id="removeToc" type="checkbox" checked> 移除 EPUB 導覽目錄 <small>略過可辨識的導覽頁，避免目錄重複。</small></label><label><input id="zip" type="checkbox" checked> 多本書打包 ZIP <small>多本轉換後合併下載，單本仍直接下載 TXT。</small></label></div><div class="action-row"><button id="convertBtn" class="primary" disabled>開始轉換</button><button id="clearBtn" class="subtle">清除檔案</button></div><div id="status" role="status" aria-live="polite"></div><div id="results"></div></section><footer><span>僅支援未加密 EPUB · UTF-8 TXT</span><span id="network"></span></footer></main><aside id="updateBanner" class="update-banner" hidden><span>偵測到新版本，是否立即更新？</span><button id="applyUpdate" class="primary">立即更新</button><button id="dismissUpdate" class="subtle">稍後</button></aside><dialog id="installHelp"><h2>安裝到主畫面</h2><p>iPhone / iPad：使用 Safari 開啟網站，點選「分享」→「加入主畫面」。</p><p>Android / Windows：使用 Chrome 或 Edge 的「安裝應用程式」功能。</p><button id="closeHelp">關閉</button></dialog><script type="module" src="/src/main.js"></script></body></html>
